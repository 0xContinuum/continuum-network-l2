<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuum Network ($CTM) - Web3 DApp</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v5 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="flex flex-col justify-between font-sans antialiased">

    <!-- NAV BAR -->
    <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl">⚡</span>
                <span class="text-lg font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                    Continuum
                </span>
                <span class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full font-mono">
                    L2 Testnet
                </span>
            </div>
            <button id="connectBtn" onclick="connectWallet()" class="bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-semibold px-3 py-1.5 text-xs rounded-xl transition duration-200 shadow-lg shadow-blue-500/20">
                ⚡ Cüzdan Aktif
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full space-y-5">
        
        <!-- DASHBOARD HEADER -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">
                Gazsız ve Işık Hızında <span class="text-blue-400">$CTM</span>
            </h1>
            <p class="text-slate-400 text-xs max-w-xl mx-auto">
                Continuum L2 ekosisteminde bakiyeni görüntüle ve tek tıkla transfer et.
            </p>
        </div>

        <!-- WALLET STATUS CARD -->
        <div class="bg-slate-900/80 rounded-2xl p-4 glow-box space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-xs font-medium text-slate-400">Bağlı Cüzdan</span>
                <div class="flex items-center gap-2">
                    <span id="walletAddress" class="text-xs font-mono text-cyan-400 bg-slate-800 px-2.5 py-1 rounded-lg">
                        Yükleniyor...
                    </span>
                    <button onclick="copyAddress()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300" title="Adresi Kopyala">📋</button>
                    <button onclick="showPrivateKey()" class="text-xs bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded font-semibold transition" title="Private Key Göster">🔑 Key</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-1">
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold">Bakiye ($CTM)</span>
                    <div id="ctmBalance" class="text-xl font-bold text-white mt-0.5">0.00 CTM</div>
                </div>
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-[10px] text-slate-400 uppercase font-semibold">Ağ Durumu</span>
                    <div id="networkStatus" class="text-sm font-semibold text-slate-400 mt-1">Bağlanıyor...</div>
                </div>
            </div>
        </div>

        <!-- TRANSACTION CARD -->
        <div class="bg-slate-900/80 rounded-2xl p-4 glow-box space-y-4">
            <h2 class="text-base font-bold flex items-center gap-2">
                <span>💸</span> $CTM Transfer Et
            </h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-1">ALICI ADRESİ</label>
                    <input id="recipientInput" type="text" placeholder="0x..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500 font-mono transition">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-400 mb-1">MİKTAR ($CTM)</label>
                    <input id="amountInput" type="number" placeholder="100" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500 font-mono transition">
                </div>
                <button onclick="sendTokens()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 text-xs rounded-xl transition duration-200">
                    Transferi Onayla
                </button>
            </div>
            <div id="txStatus" class="hidden p-3 rounded-xl text-[11px] font-mono break-all"></div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 py-3 text-center text-[11px] text-slate-500 space-y-1">
        <p>Continuum Network ($CTM) — Built on Base Sepolia L2</p>
        <p>
            <a href="https://sepolia.basescan.org/token/0x078712Ac537F24B76a1AAB05624c02A9E0a28C13" target="_blank" class="text-blue-400 hover:underline">
                Basescan Kontratı ↗
            </a>
        </p>
    </footer>

    <!-- WEB3 LOGIC & TELEGRAM SDK -->
    <script>
        const CTM_CONTRACT_ADDRESS = "0x078712Ac537F24B76a1AAB05624c02A9E0a28C13";
        const RPC_URL = "https://sepolia.base.org";

        const ERC20_ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function transfer(address to, uint256 amount) returns (bool)",
            "function decimals() view returns (uint8)"
        ];

        let provider, wallet, ctmContract, userAddress;

        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await autoInitWallet();
        });

        async function autoInitWallet() {
            provider = new ethers.providers.JsonRpcProvider(RPC_URL);

            let privateKey;
            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;

            if (tgUser && tgUser.id) {
                const seedString = `continuum_network_l2_salt_2026_${tgUser.id}`;
                privateKey = ethers.utils.keccak256(ethers.utils.toUtf8Bytes(seedString));
            } else if (window.ethereum) {
                try {
                    const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                    const accounts = await web3Provider.listAccounts();
                    if (accounts.length > 0) {
                        userAddress = accounts[0];
                        const signer = web3Provider.getSigner();
                        ctmContract = new ethers.Contract(CTM_CONTRACT_ADDRESS, ERC20_ABI, signer);
                        updateUI(userAddress, "🟢 Base Sepolia (MetaMask)");
                        await updateBalance();
                        return;
                    }
                } catch (e) {
                    console.log("MetaMask bağlanamadı.");
                }
            }

            if (!privateKey) {
                privateKey = localStorage.getItem("continuum_private_key");
                if (!privateKey) {
                    privateKey = ethers.Wallet.createRandom().privateKey;
                    localStorage.setItem("continuum_private_key", privateKey);
                }
            }

            wallet = new ethers.Wallet(privateKey, provider);
            userAddress = wallet.address;
            ctmContract = new ethers.Contract(CTM_CONTRACT_ADDRESS, ERC20_ABI, wallet);

            updateUI(userAddress, "🟢 Base Sepolia (Telegram Wallet)");
            await updateBalance();
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
                    await web3Provider.send("eth_requestAccounts", []);
                    const signer = web3Provider.getSigner();
                    userAddress = await signer.getAddress();
                    ctmContract = new ethers.Contract(CTM_CONTRACT_ADDRESS, ERC20_ABI, signer);
                    updateUI(userAddress, "🟢 Base Sepolia (MetaMask)");
                    await updateBalance();
                } catch (err) {
                    alert("MetaMask Hatası: " + err.message);
                }
            } else {
                alert("Telegram cüzdanınız cihazlar arası senkronize edildi!\n\nAdresiniz: " + userAddress);
            }
        }

        function updateUI(address, status) {
            document.getElementById('walletAddress').innerText = `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
            document.getElementById('networkStatus').innerText = status;
            document.getElementById('networkStatus').className = "text-xs font-semibold text-emerald-400 mt-1";
        }

        async function updateBalance() {
            if (!userAddress) return;
            try {
                const readContract = new ethers.Contract(CTM_CONTRACT_ADDRESS, ERC20_ABI, provider);
                const balance = await readContract.balanceOf(userAddress);
                const formatted = ethers.utils.formatUnits(balance, 18);
                document.getElementById('ctmBalance').innerText = `${parseFloat(formatted).toLocaleString()} $CTM`;
            } catch (err) {
                console.error("Bakiye okuma hatası:", err);
            }
        }

        function copyAddress() {
            if (userAddress) {
                navigator.clipboard.writeText(userAddress);
                alert("Cüzdan adresi kopyalandı:\n" + userAddress);
            }
        }

        function showPrivateKey() {
            if (!wallet) {
                alert("MetaMask ile bağlısınız. Private Key'inize MetaMask eklentiniz üzerinden erişebilirsiniz.");
                return;
            }

            const confirmExport = confirm(
                "⚠️ UYARI: Private Key'iniz cüzdanınızın tam kontrolünü verir. Bu anahtarı asla başkasıyla paylaşmayın!\n\n" +
                "Private Key'inizi kopyalayıp MetaMask veya Trust Wallet'a aktarmak istiyor musunuz?"
            );

            if (confirmExport) {
                navigator.clipboard.writeText(wallet.privateKey);
                alert("✅ Private Key panoya kopyalandı!\n\nMetaMask -> Hesap Ekle -> 'İçe Aktar (Import Account)' seçeneğine yapıştırabilirsiniz.");
            }
        }

        async function sendTokens() {
            const recipient = document.getElementById('recipientInput').value;
            const amount = document.getElementById('amountInput').value;
            const statusBox = document.getElementById('txStatus');

            if (!recipient || !amount) {
                alert("Lütfen alıcı adresi ve miktarı girin!");
                return;
            }

            try {
                statusBox.classList.remove('hidden', 'bg-red-900/30', 'text-red-400');
                statusBox.classList.add('bg-blue-900/30', 'text-blue-300');
                statusBox.innerText = "⏳ İşlem işleniyor...";

                const parsedAmount = ethers.utils.parseUnits(amount.toString(), 18);
                const tx = await ctmContract.transfer(recipient, parsedAmount);

                statusBox.innerText = `🚀 İşlem yayınlandı! Tx Hash:\n${tx.hash}\nOnay bekleniyor...`;
                await tx.wait();

                statusBox.classList.remove('bg-blue-900/30', 'text-blue-300');
                statusBox.classList.add('bg-emerald-900/30', 'text-emerald-400');
                statusBox.innerText = `✅ Transfer Başarılı! Tx Hash:\n${tx.hash}`;
                
                await updateBalance();
            } catch (err) {
                statusBox.classList.remove('hidden', 'bg-blue-900/30', 'text-blue-300');
                statusBox.classList.add('bg-red-900/30', 'text-red-400');
                statusBox.innerText = `❌ Hata: ${err.reason || err.message}`;
            }
        }
    </script>
</body>
</html>
