<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181304" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="gold-glow">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#gold-bg)" rx="40" />
  <rect x="25" y="25" width="950" height="950" fill="none" stroke="url(#gold-grad)" stroke-width="6" rx="30" filter="url(#gold-glow)" />
  <!-- Outer Gold Hexagon -->
  <polygon points="500,200 680,300 680,520 500,620 320,520 320,300" fill="none" stroke="url(#gold-grad)" stroke-width="10" filter="url(#gold-glow)" />
  <!-- Inner Core -->
  <polygon points="500,260 620,330 620,480 500,550 380,480 380,330" fill="#f59e0b" fill-opacity="0.15" stroke="#fef08a" stroke-width="3" />
  <circle cx="500" cy="410" r="45" fill="url(#gold-grad)" filter="url(#gold-glow)" />
  <!-- Text -->
  <text x="500" y="730" text-anchor="middle" fill="#fef08a" font-family="'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="4">GENESIS #1 CHAMPION</text>
  <text x="500" y="790" text-anchor="middle" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="6">CONTINUUM NETWORK L2</text>
  <rect x="330" y="835" width="340" height="46" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="2" rx="23" />
  <text x="500" y="864" text-anchor="middle" fill="#fef08a" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="3">1 OF 1 LIMITED EDITION</text>
</svg>
