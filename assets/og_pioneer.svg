<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg)" rx="40" />
  <rect x="20" y="20" width="960" height="960" fill="none" stroke="#1e293b" stroke-width="4" rx="30" />
  <!-- Neon Ring -->
  <circle cx="500" cy="450" r="220" fill="none" stroke="url(#cyan-glow)" stroke-width="8" filter="url(#glow)" />
  <circle cx="500" cy="450" r="170" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="10 15" />
  <!-- Core Symbol ($CTM) -->
  <path d="M500 330 L590 420 L500 510 L410 420 Z" fill="none" stroke="#38bdf8" stroke-width="12" filter="url(#glow)" />
  <circle cx="500" cy="420" r="25" fill="#38bdf8" filter="url(#glow)" />
  <!-- Text -->
  <text x="500" y="740" text-anchor="middle" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="4">CONTINUUM OG PIONEER</text>
  <text x="500" y="800" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" letter-spacing="6">BASE SEPOLIA L2 • TESTNET 2026</text>
  <rect x="350" y="840" width="300" height="40" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" rx="20" />
  <text x="500" y="866" text-anchor="middle" fill="#7dd3fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SOULBOUND BADGE</text>
</svg>
